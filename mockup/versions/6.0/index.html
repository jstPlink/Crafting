<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crafting — Marianan Station (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080b;
  --panel:#0f1115;
  --line:#23272c;
  --row:#2c2f34;
  --row-hi:#3a3e44;
  --txt:#e9edf0;
  --dim:#8b949c;
  --accent:#f4623a;
  --accent-2:#ff8a5c;
  --good:#63e07a;
  --bad:#ff5a5a;
  --warn:#ffb547;
  --pri:#d6574b;
  --sec:#d9a521;
  --eng:#2f86ea;
  --pow:#2e7dff;
  --ic-bg:#474d55;
  --font:"Rajdhani","Bahnschrift","Barlow Condensed","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--txt);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--bg)}

/* ---------- scene ---------- */
.scene{position:absolute;inset:0;background:#0c0f12}

/* ---------- top bar ---------- */
#top{position:absolute;left:0;top:0;width:100%;height:160px;pointer-events:none}
#top>*{pointer-events:auto}
.hud{position:absolute;left:80px;top:34px;display:flex;align-items:center;gap:18px}
.emblem{width:72px;height:72px;border-radius:50%;border:2px solid #667;background:radial-gradient(circle,#1b1f24,#0b0d10);display:grid;place-items:center;}
.hud-bars{width:230px}
.hud-bar{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--dim);height:20px}
.hud-bar b{width:52px;font-weight:600;color:#cfd6dc;text-align:right}
.segs{flex:1;display:flex;gap:2px}
.segs i{flex:1;height:8px;background:#22262b}
.segs i.on.g{background:#3ddb54}.segs i.on.b{background:#2f86ea}
.hud-speed{margin-top:6px;background:#15181c;text-align:center;font-size:16px;padding:2px 0;border-radius:2px;color:#cfd6dc;width:120px;margin-left:56px}
.hud-lv{width:26px;height:26px;border-radius:50%;border:2px solid var(--good);color:var(--good);display:grid;place-items:center;font-size:13px;font-weight:700;align-self:flex-start;margin-top:16px}

.station{position:absolute;left:50%;top:38px;transform:translateX(-50%);min-width:340px;text-align:center;font-size:36px;font-weight:700;letter-spacing:.06em;
  padding:6px 50px;clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%);background:#0a0c0f;
  border:0;box-shadow:inset 0 0 0 1px #4a4f55}
.station-wrap::before{content:"";position:absolute;left:0;right:0;top:66px;height:1px;background:#2f3439}
.tabs{position:absolute;left:50%;top:98px;transform:translateX(-50%);display:flex;align-items:center;gap:0;width:900px;justify-content:space-between;font-size:18px;letter-spacing:.04em}
.tab{padding:10px 30px;color:#cfd6dc;position:relative;white-space:nowrap}
.tab.act{color:var(--accent-2)}
.tab.act::before,.tab.act::after{content:"";position:absolute;top:0;bottom:0;width:10px;border:2px solid var(--accent)}
.tab.act::before{left:0;border-right:0}.tab.act::after{right:0;border-left:0}
#build{position:absolute;right:80px;top:110px;font-size:13px;letter-spacing:.12em;color:#59626a;text-align:right}
.credits{position:absolute;right:80px;top:44px;border:2px solid var(--accent);color:var(--accent-2);padding:12px 24px;font-size:24px;letter-spacing:.05em;background:#1c1616}

/* ---------- glyphs ---------- */
.gp,.key{font-style:normal;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;font-weight:700;line-height:1}
.gp{width:26px;height:26px;border-radius:50%;font-size:14px;background:#22262b;border:2px solid #555c64;color:#dfe5ea}
.gp.a{border-color:#5ed26e;color:#5ed26e}.gp.b{border-color:#ee5f5f;color:#ee5f5f}.gp.x{border-color:#5aa2ff;color:#5aa2ff}.gp.y{border-color:#f0c24a;color:#f0c24a}
.gp.pill{border-radius:8px;width:auto;min-width:34px;padding:0 7px;height:24px;font-size:13px}
.gp.rs{background:#1a1d21}
.gp svg{width:16px;height:16px}
.key{min-width:30px;height:26px;padding:0 8px;border-radius:4px;background:#22262b;border:1px solid #59606a;border-bottom-width:3px;color:#dfe5ea;font-size:14px}

/* ---------- panels ---------- */
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);}
#left{left:40px;top:180px;width:450px;padding-bottom:16px}
.lp-head{display:flex;align-items:stretch;height:46px;background:var(--accent);color:#fff;margin:0 0 0 0;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.lp-head .ic{width:56px;background:#e8e8e8;display:grid;place-items:center;color:var(--accent)}
.lp-head .nm{flex:1;padding:0 16px;font-size:26px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center}
.lp-head .pw{display:flex;align-items:center;gap:8px;padding-right:16px;font-size:24px;font-weight:700}
.lp-head .pw svg{width:24px;height:24px}
.lp-head .pw .n{color:#9dff9d}.lp-head .pw .n.warn{color:#fff2a0}.lp-head .pw .n.bad{color:#ffd0d0}
.lp-body{padding:6px 20px 0}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700;letter-spacing:.06em;color:#dfe5ea;margin:12px 0 6px}
.sec-title span{font-weight:600;color:var(--dim);font-size:15px}
.slot{display:flex;align-items:center;height:42px;margin-bottom:4px;background:linear-gradient(#34373c,#2a2d31);cursor:pointer;position:relative;
  border:1px solid transparent;transition:background .12s}
.slot:hover{background:linear-gradient(#3d4148,#30343a)}
.slot .ic{width:38px;height:100%;display:grid;place-items:center;color:#fff}
.slot .ic svg{width:22px;height:22px}
.slot.pri .ic{background:var(--pri)}.slot.sec .ic{background:var(--sec)}.slot.eng .ic{background:var(--eng)}
.slot .nm{flex:1;padding:0 12px;font-size:20px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pwr{display:flex;align-items:center;gap:3px;font-size:16px;color:var(--dim);margin-right:8px}
.slot .pwr svg{width:12px;height:12px}
.slot .unq{width:34px;height:100%;display:grid;place-items:center;color:#c34b4b;font-size:18px;font-weight:700;border-left:1px solid #1c1e21}
.slot .unq:hover{background:#c34b4b;color:#fff}
.slot .unq svg{width:14px;height:14px}
.slot .kh{margin-right:8px}
.slot.empty{background:#0f1115;border:1px dashed #4b5158}
.slot.empty .ic{background:#0f1115;color:#69727a;border-right:1px dashed #4b5158}
.slot.empty .nm{color:#6b747c;font-weight:500;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.slot.empty:hover{background:#16181c}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot.sel.focus{background:linear-gradient(#55402f,#3d2f25)}
.slot.sel.empty.focus{background:#2a1a15}
.slot.hov{background:linear-gradient(#3d4148,#30343a)}
.slot.pv-add .nm::after{content:" → NEW";color:var(--good);font-size:14px}
.slot.pv-rem .nm{color:#8a4a4a;text-decoration:line-through}
.slot.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--good);background:#2f5a3a}100%{}}

/* ---------- right column ---------- */
#right{position:absolute;left:1410px;top:180px;width:470px;height:780px;background:none;border:0;box-shadow:none;display:flex;flex-direction:column}
.ov,.cg{background:var(--panel);border:1px solid var(--line);}
.ov{flex:none}
.head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--accent);color:#fff;font-size:26px;font-weight:700;letter-spacing:.04em;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.head small{font-size:15px;font-weight:600;color:#ffe3d8;letter-spacing:.06em}
.ov-body{padding:10px 20px 6px}
.pw-row{display:flex;align-items:center;gap:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pw-row .lbl{width:104px;white-space:nowrap;font-size:15px;color:var(--dim);letter-spacing:.06em;line-height:1.1}
.pw-row .lbl b{display:block;white-space:nowrap;font-size:26px;color:var(--txt);letter-spacing:.02em;margin-top:2px}
.pw-row .lbl b.bad{color:var(--bad)}
.pbar{flex:1;display:flex;gap:2px;height:26px;align-items:stretch}
.pbar i{flex:1;background:#23272c;position:relative}
.pbar i.on{background:var(--pow)}
.pbar i.add{background:var(--good)}
.pbar i.over{background:var(--bad)}
.pbar i.rem{background:repeating-linear-gradient(45deg,#4a2a2a 0 4px,#2a1a1a 4px 8px);outline:1px solid #a03a3a;outline-offset:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.st{display:flex;align-items:center;gap:14px;padding:8px 8px;position:relative}
.st:nth-child(2n){border-left:1px solid var(--line);padding-left:22px}
.st .si{width:34px;height:34px;color:#d6dbe0;display:grid;place-items:center}
.st .si svg{width:32px;height:32px}
.st .sl{font-size:14px;color:var(--dim);letter-spacing:.08em}
.st .sv{font-size:26px;font-weight:700;line-height:1}
.st .sv{white-space:nowrap}
.st .sv small{font-size:15px;font-weight:600;margin-left:3px;color:var(--dim)}
.st>div:nth-child(2){min-width:0}
/* diffs never take layout space: fixed slots / absolute badges that just appear and disappear */
.st .sd{position:absolute;right:8px;bottom:9px;font-size:15px;font-weight:700;padding:1px 6px;border-radius:2px}
.sd.off{visibility:hidden}
.dslot{flex:none;width:62px;display:flex;justify-content:flex-end}
.dslot .sd{font-size:16px;font-weight:700;padding:1px 7px;border-radius:2px}
.up{color:var(--good)}.dn{color:var(--bad)}.wn{color:var(--warn)}.nt{color:#cfd6dc}
.sd.up{background:#1a3324}.sd.dn{background:#351a1c}.sd.wn{background:#35291a}.sd.nt{background:#22262b}
.sv.up{color:var(--good)}.sv.dn{color:var(--bad)}.sv.nt{color:var(--txt)}
.wrow{display:grid;grid-template-columns:104px 1fr 1fr 1fr;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wrow .rl{font-size:15px;color:var(--dim);letter-spacing:.06em}
.wc{display:flex;align-items:center;gap:8px;height:34px}
.wc svg{width:20px;height:20px;color:#b9c0c7;flex:none}
.wc .v{font-size:24px;font-weight:700;line-height:1}
.wc .v.zero{color:#5c646b;font-weight:600}
.wc .d{font-size:14px;font-weight:700}
.wc.k svg{color:#e8695c}.wc.e svg{color:#f0a04b}.wc.n svg{color:#5cb4ff}
.wrows{padding-top:2px}

.cg{margin-top:10px;flex:1;min-height:0;display:flex;flex-direction:column}
.cg .target{padding:8px 18px 4px;font-size:15px;color:var(--dim);letter-spacing:.06em;display:flex;justify-content:space-between}
.cg .target b{color:var(--txt);font-weight:600}
.cats{display:flex;align-items:center;gap:6px;padding:4px 14px 8px}
.cat{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:.06em;padding:7px 0;background:#1e2126;color:var(--dim);border-bottom:3px solid transparent;cursor:pointer}
.cat i{font-style:normal;margin-left:4px;color:#69727a}
.cat.act{color:#fff;background:#2b2f35}
.cat.act{border-color:var(--accent)}
.cat.act.pri{border-color:var(--pri)}.cat.act.sec{border-color:var(--sec)}.cat.act.eng{border-color:var(--eng)}
.cg-list{flex:1;overflow-y:auto;padding:0 14px 10px;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.cg-row{display:flex;align-items:center;gap:12px;height:66px;padding:0 12px 0 0;margin-bottom:5px;background:linear-gradient(#2f3237,#282b30);cursor:pointer;border:1px solid transparent;position:relative}
.cg-row .ic{width:46px;align-self:stretch;display:grid;place-items:center;color:#fff}
.cg-row.pri .ic{background:var(--pri)}.cg-row.sec .ic{background:var(--sec)}.cg-row.eng .ic{background:var(--eng)}
.cg-row .ic svg{width:24px;height:24px}
.cg-row .mid{flex:1;min-width:0}
.cg-row .nm{font-size:20px;font-weight:700;letter-spacing:.02em;display:flex;gap:8px;align-items:baseline}
.cg-row .nm small{font-size:15px;color:var(--dim);font-weight:600}
.chips{display:flex;gap:12px;font-size:15px;color:#c3cad1;margin-top:3px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip svg{width:12px;height:12px}
.chip em{font-style:normal;font-weight:700;font-size:13px}
.cg-row .nm{white-space:nowrap;min-width:0}
.cg-row .nmt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cg-row .nm small{flex:none}
.cg-row .act{flex:none;width:104px;justify-content:flex-end;font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--accent-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.cg-row.nopow .act{color:var(--bad)}
.cg-row.nopow .nm{color:#c9aaaa}
.cg-row.hov,.cg-row:hover{background:linear-gradient(#3b3f45,#30343a)}
.cg-row.sel{border-color:var(--accent);background:linear-gradient(#55402f,#3d2f25);box-shadow:0 0 0 1px var(--accent)}
.cg-empty{padding:40px 30px;text-align:center;color:#6b747c;font-size:18px;letter-spacing:.05em;line-height:1.5}

/* ---------- ship (3D) ---------- */
#shipbox{position:absolute;left:490px;top:168px;width:920px;height:468px;cursor:grab;background:#0c0f12;overflow:hidden}
#shipbox:active{cursor:grabbing}
#shipbox canvas{display:block;width:100%;height:100%;outline:0}
.tag3d{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#0a0c0f;border:2px solid var(--accent);padding:4px 12px 5px;text-align:center;pointer-events:none;white-space:nowrap;display:none}
.tag3d small{display:block;font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--dim)}
.tag3d b{display:block;font-size:17px;letter-spacing:.06em;color:#fff}
.tag3d.hv{border-color:#8b949c}


/* ---------- sockets / pylons ---------- */
#left{height:auto;max-height:780px;display:flex;flex-direction:column;padding-bottom:0}
.lp-body{overflow-y:auto;flex:1;min-height:0;padding:6px 20px 14px;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.sec-title .st-l{display:flex;align-items:center;gap:8px}
.sg{flex:none;display:block}
.slot{height:38px;margin-left:calc(var(--d,0)*24px)}
.slot .ic{width:36px}
/* tree line: from the bottom of the parent pylon row (--up rows above) down to the middle of this row */
.slot.child::before{content:"";position:absolute;left:-15px;width:12px;border-left:2px solid #3a3f46;border-bottom:2px solid #3a3f46;
  top:calc(-1 * ((var(--up,1) - 1) * 42px + 5px));height:calc((var(--up,1) - 1) * 42px + 5px + 18px);pointer-events:none}
/* heat meter (continuous: heatsink values are too large for segments) */
.heat-row{padding-top:8px}
.hbar{flex:1;height:14px;background:#23272c;position:relative;overflow:hidden}
.hbar i{position:absolute;top:0;bottom:0;left:0}
.hbar i.cur{background:#e0782f}
.hbar i.add{background:var(--warn)}
.hbar i.rem{background:repeating-linear-gradient(45deg,#4a2a2a 0 4px,#2a1a1a 4px 8px)}
.hbar.hot i.cur,.hbar.hot i.add{background:var(--bad)}
.hwrap{flex:1;display:flex;flex-direction:column;gap:4px}
.hwrap .hbar{flex:none}
.hstat{font-size:13px;font-weight:700;letter-spacing:.1em}
.hstat.ok{color:var(--good)}.hstat.no{color:var(--bad)}
.valrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.valrow .rl{font-size:15px;color:var(--dim);letter-spacing:.1em}
.valrow .val{display:flex;align-items:center;gap:10px}
.valrow .val svg{width:22px;height:22px;color:var(--accent-2)}
.valrow .val b{font-size:38px;line-height:1;color:#fff;letter-spacing:.02em}
.valrow .sd{font-size:16px;font-weight:700;padding:1px 7px}

/* ---------- view mode: ship only ---------- */
#viewui{display:none}
#stage.viewmode #shipbox{left:0;top:0;width:1920px;height:1080px;z-index:25}
#stage.viewmode #viewui{display:block}
#stage.viewmode .tag3d{display:none!important}
#stage.viewmode>*:not(#shipbox):not(.scene):not(#toast){visibility:hidden}
.vhint{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:15px;letter-spacing:.14em;color:#6b747c;pointer-events:none}
#viewexit{position:absolute;right:40px;top:34px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.1em;color:#cfd6dc;
  padding:8px 16px;background:rgba(10,12,15,.7);border:1px solid #3a3f46}
#viewexit:hover{border-color:var(--accent);color:#fff}
.st .sl{white-space:nowrap;font-size:13px;letter-spacing:.06em}
.st .sl i{font-style:normal;color:#5c646b;font-size:12px}
#card .ch .fam{margin-left:auto;font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:600}
#card table{font-size:16px}
#card td{padding:2px 16px}
#card th{padding:6px 16px 3px}
/* rarity */
.rdot{display:inline-block;flex:none;width:10px;height:10px;margin-right:8px;background:var(--rc);box-shadow:0 0 6px var(--rc);vertical-align:1px}
.cg-row{height:48px}
.slot.rar .ic,.cg-row.rar .ic{box-shadow:inset -4px 0 0 var(--rc)}
/* rarity tint: colour fading from the icon side into the row */
.slot.rar,.cg-row.rar{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 38%,#2c2f34) 0%,color-mix(in srgb,var(--rc) 12%,#2c2f34) 45%,#2a2d31 100%)}
.slot.rar:hover,.slot.rar.hov,.cg-row.rar:hover,.cg-row.rar.hov{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 48%,#3a3e44) 0%,color-mix(in srgb,var(--rc) 18%,#3a3e44) 45%,#34373c 100%)}
.slot.rar.sel.focus,.cg-row.rar.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 40%,#55402f) 0%,#55402f 45%,#3d2f25 100%)}
.slot.rar{border-bottom-color:color-mix(in srgb,var(--rc) 55%,transparent)}
.slot.rar.sel{border-color:var(--accent)}
.cg-row.rar{border-left:0}
.tag3d b .rdot{vertical-align:2px}
.slot.pyl .ic{background:var(--ic-bg)}
.slot.free{background:#0f1115;border:1px dashed #4b5158}
.slot.free .ic{background:#0f1115;border-right:1px dashed #4b5158}
.slot.free .nm{color:#6b747c;font-weight:500;font-size:17px;letter-spacing:.06em}
.slot.free:hover{background:#16181c}
.slot.sel.free.focus{background:#2a1a15}
.slot .sg{margin-right:8px}
.outs{display:flex;gap:5px;align-items:center;margin-right:10px}
.outs .sg{margin:0}
.outs.rt{justify-content:flex-end;margin-right:0}
.st{padding:6px 8px}
.wc{height:30px}
.wrow{padding:5px 0;grid-template-columns:110px 1fr 1fr 1fr}
.wc.sk .v i{font-style:normal;color:var(--dim);font-size:16px;font-weight:600}
.cat{font-size:13px;padding:7px 0;letter-spacing:.04em}
.cg-row.pyl .ic{background:var(--ic-bg)}
.cg .target{align-items:center}
.cg .target span{display:flex;align-items:center;gap:6px}
#card .ch .tg{display:inline-flex;align-items:center;gap:6px;background:#1c2025;border:1px solid #3a3f46;font-size:14px}
#card .kids{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kidchip{display:inline-flex;align-items:center;gap:6px;background:#1c2025;padding:4px 10px;font-size:16px;color:#dfe5ea}
.kidchip i{color:#6b747c;font-style:normal}
.retline{padding:8px 16px;font-size:15px;color:var(--warn);letter-spacing:.04em;border-top:1px solid #16181b}
#card small.tot{color:#6b747c;font-size:13px;font-weight:600}


/* ---------- main body selector ---------- */
.lp-head.bodysel .ic{width:46px}
.lp-head.bodysel .nm{gap:6px;padding:0 8px;font-size:23px;white-space:nowrap}
.lp-head.bodysel .pw{white-space:nowrap;font-size:22px;gap:6px;padding-right:12px}
.lp-head.bodysel .pw svg{width:20px;height:20px}
.bsb{width:26px;height:30px;background:#e4542f;color:#fff;font-size:26px;font-weight:700;line-height:1;display:grid;place-items:center;padding-bottom:3px}

.pk-grid{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.bcard{background:#14171b;border:2px solid #23272c;cursor:pointer;display:flex;flex-direction:column}
.bcard.cur{border-color:#3d6a49}
.bcard.sel{border-color:var(--accent);background:#211914}

.bc-cnt b{color:var(--txt);font-size:20px;margin-right:8px}

/* ---------- compare card ---------- */
#card{position:absolute;left:560px;top:640px;width:780px;min-height:262px;background:#0a0c0f;border:1px solid #2a2d31;}
#card .ch{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;letter-spacing:.05em}
#card .ch .tg{font-size:14px;letter-spacing:.1em;color:#fff;padding:2px 8px;background:#555}

#card .ch .arrow{color:var(--accent-2)}
#card .ch .old{color:var(--dim)}
#card table{width:100%;border-collapse:collapse;font-size:19px}
#card th{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:600;text-align:right;padding:8px 16px 4px}
#card th:first-child{text-align:left}
#card td{padding:5px 16px;text-align:right;font-weight:600;border-top:1px solid #16181b}
#card td:first-child{text-align:left;color:#cfd6dc;font-weight:600;display:flex;align-items:center;gap:10px}
#card td:first-child svg{width:16px;height:16px;color:#aab2ba}
#card td.o{color:var(--dim)}
#card td.dl{width:110px;font-weight:700}
#card .cf{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);font-size:17px;letter-spacing:.05em;color:var(--dim);background:#121417}
#card .cf .ok{color:var(--good);font-weight:700}
#card .cf .no{color:var(--bad);font-weight:700}

#card .emptyc{padding:20px 16px;color:#7b848c;font-size:18px;letter-spacing:.04em;line-height:1.5}

/* ---------- bottom bar ---------- */
#bottom{position:absolute;left:0;bottom:0;width:100%;height:100px;display:flex;align-items:center;justify-content:space-between;padding:26px 80px 0}
.hints{display:flex;gap:34px;align-items:center}
.hint{display:flex;align-items:center;gap:10px;font-size:19px;letter-spacing:.06em;color:#c9d0d6;text-transform:uppercase;position:relative;padding:6px 0;cursor:pointer}
.hint.off{color:#4a5158;cursor:not-allowed}
.hint .g{display:flex;gap:4px}
.hint.hold::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--accent)}
.hint .ht{font-size:12px;color:var(--dim);letter-spacing:.1em}
.rightbar{display:flex;align-items:center;gap:26px}
.inputpill{font-size:13px;letter-spacing:.12em;color:#7b848c;border:1px dashed #4b5158;padding:6px 12px;border-radius:14px}
.inputpill:hover{color:#fff;border-color:#8b949c}
#dbgRandom{position:absolute;left:80px;top:128px;z-index:5}
.dbgbtn{font-size:13px;letter-spacing:.12em;color:#c9a0ff;border:1px dashed #7a5aa8;padding:6px 12px;border-radius:14px}
.dbgbtn:hover{color:#fff;border-color:#c9a0ff;background:#241a33}
.leave{position:relative;overflow:hidden;background:#c93c2c;color:#fff;padding:9px 22px;font-size:22px;letter-spacing:.06em;display:flex;align-items:center;gap:12px;font-weight:600;
  clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.leave::before{content:"";position:absolute;inset:0;background:#e0766a;transform-origin:left;transform:scaleX(var(--p,0))}
.leave>*{position:relative}
.leave .key,.leave .gp{background:#8a2a20;border-color:#e08a80;color:#fff}

/* ---------- toast / overlay ---------- */
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-10px);visibility:hidden;padding:8px 22px;font-size:20px;font-weight:700;letter-spacing:.06em;background:#0a0c0f;border:1px solid var(--good);color:var(--good);pointer-events:none;z-index:20}
#toast.show{visibility:visible;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad);color:var(--bad)}
#toast.info{border-color:#8b949c;color:#dfe5ea}
#leave-ov{position:absolute;inset:0;background:#000;display:none;place-items:center;font-size:40px;letter-spacing:.3em;color:var(--accent-2);z-index:50;cursor:pointer}
#leave-ov.show{display:grid}
#leave-ov small{display:block;font-size:16px;color:var(--dim);letter-spacing:.14em;text-align:center;margin-top:14px}

/* ---------- 0.4.3 · experiment "keyStats": key stat on every row, delta, BEST, sorting ---------- */
.slot .ks{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:44px;margin-right:6px;font-size:16px;font-weight:700;color:#dfe5ea}

.cg-row.two{height:58px}
.cg-row.two .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-row .sub{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:16px;font-weight:600;color:var(--dim);white-space:nowrap}
.cg-row .sub b{font-weight:700;color:var(--txt)}
.cg-row .sub .q{color:#c3cad1}
.dlt{font-weight:700}
.dlt.up{color:var(--good)}.dlt.dn{color:var(--bad)}.dlt.wn{color:var(--warn)}.dlt.nt{color:var(--dim)}
.best{font-size:13px;font-weight:700;letter-spacing:.12em;padding:0 7px;border:1px solid var(--accent);color:var(--accent-2)}
.sortchip{font-size:15px;font-weight:600;letter-spacing:.06em;color:#cfd6dc;border:1px dashed #4b5158;padding:2px 10px}
.sortchip:hover{color:#fff;border-color:var(--accent-2)}
.cg-empty .cg-sub{font-size:15px}

/* ---------- 0.4.3 · experiment "overview": free-socket summary ---------- */
.valrow.sum{align-items:flex-end;gap:14px}
.valrow.sum .vcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.valrow.sum .vcol:last-child{flex:1}
.valrow.sum .val b{font-size:32px}
.valrow.sum .val svg{width:20px;height:20px}

.valrow.sum .sks{display:flex;gap:4px;align-items:center;height:32px}
.valrow.sum .sk{flex:1;display:flex;align-items:center;gap:4px;line-height:1;white-space:nowrap}

.valrow.sum .sk i{font-style:normal;font-size:16px;font-weight:600;color:var(--dim)}
.valrow.sum .sk .d{font-size:14px;font-weight:700}
#stage.ux-ov .st{padding-top:4px;padding-bottom:4px}

/* ---------- 0.4.3 · experiment "bigText": larger type, more contrast on dim text ---------- */
#stage.ux-big{--dim:#9aa3ab}

#stage.ux-big .st .sv small{font-size:16px}
#stage.ux-big .st .sd{font-size:16px}

#stage.ux-big .valrow .rl{font-size:16px}
#stage.ux-big .cg .target{font-size:16px}

#stage.ux-big .sortchip{font-size:16px}
#stage.ux-big .cg-row .sub{font-size:17px}
#stage.ux-big .best{font-size:14px}

/* ---------- experiment "rarityTag" (backlog 2+3): LVn tag before the name, rows stay neutral ---------- */
.rtag{display:inline-flex;align-items:center;flex:none;height:19px;padding:0 5px;margin-right:8px;border-radius:2px;vertical-align:2px;
  background:var(--rc);color:#0b0d10;font-size:14px;font-weight:700;letter-spacing:.03em;line-height:1}

#stage.ux-rar .slot.rar:hover,#stage.ux-rar .slot.rar.hov,#stage.ux-rar .cg-row.rar:hover,#stage.ux-rar .cg-row.rar.hov{background:linear-gradient(#3d4148,#30343a)}

/* ---------- experiment "blockedReason" (backlog 6): rows that cannot be mounted say why ---------- */

/* ---------- experiment "intro" (backlog 11): first-time guide ---------- */
#intro{position:absolute;inset:0;z-index:45;display:none;place-items:center;background:rgba(4,6,8,.78)}
#intro.show{display:grid}
.in-box{width:1240px;background:#0c0e11;border:1px solid #2a2d31;box-shadow:0 20px 60px rgba(0,0,0,.6)}

.in-card{background:#14171b;border:1px solid #23272c;padding:18px 18px 20px}
.in-ic{width:46px;height:46px;display:grid;place-items:center;background:#1f2328;color:var(--accent-2);margin-bottom:12px}
.in-ic svg{width:28px;height:28px}
.in-card>b{display:block;font-size:20px;letter-spacing:.08em;margin-bottom:8px}
.in-card p{font-size:17px;line-height:1.45;color:#c3cad1}
.in-card p b{color:#fff}
.in-card p .sg{display:inline-block;vertical-align:-2px}
.in-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 20px;font-size:16px;color:#9aa3ab;letter-spacing:.04em}

.in-go{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.08em;padding:10px 20px;background:var(--accent);color:#fff}

.in-go .gp,.in-go .key{background:#8a2a20;border-color:#ffb49a;color:#fff}
#stage.ux-big .hints{gap:24px}
#stage.ux-big .hint{font-size:17px}
.hint .hg{display:inline-flex;cursor:pointer}
.hint .hg.off{opacity:.35;cursor:not-allowed}
.hints .hint{white-space:nowrap}

/* ---------- experiment "socketLabels" (backlog 9): labels on every part / free socket in 3D ---------- */
#labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab3d{position:absolute;left:0;top:0;visibility:hidden;display:flex;align-items:center;gap:5px;padding:2px 8px 3px;white-space:nowrap;
  background:rgba(10,12,15,.8);border:1px solid #3a3f46;font-size:14px;font-weight:600;letter-spacing:.03em;color:#dfe5ea;pointer-events:auto;cursor:pointer}

#stage.viewmode #labels3d{display:none}

/* heat status always on one line */
.hstat{white-space:nowrap}

/* ---------- experiment "bodyButton": plain Body title + a real CHANGE BODY button ---------- */
.bkind{font-size:13px;font-weight:700;letter-spacing:.14em;color:#ffe3d8;margin-right:10px}
.bname.plain{width:auto;text-align:left;cursor:default}
.bname.plain:hover{text-decoration:none}
.bodyrow{display:flex;gap:8px;margin:12px 20px 2px}
.bodyrow .bodybtn{flex:1;width:auto;margin:0}
.guidebtn{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:40px;padding:0 10px;background:#15181c;border:1px solid #5a6068;
  color:var(--accent-2);font-size:22px;font-weight:700;cursor:pointer}
.guidebtn:hover{border-color:#e9edf0;background:#1d2126;color:#fff}
.bodybtn{display:flex;align-items:center;gap:10px;width:calc(100% - 40px);height:40px;margin:12px 20px 2px;padding:0 12px 0 14px;
  background:#15181c;border:1px solid #5a6068;color:#e9edf0;font-size:17px;font-weight:700;letter-spacing:.1em;cursor:pointer}
.bodybtn svg{width:20px;height:20px;color:var(--accent-2)}
.bodybtn .bb-g{margin-left:auto;display:flex}
.bodybtn:hover{border-color:#e9edf0;background:#1d2126}
.bodybtn.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#2a1a15}

/* ---------- experiment "compactCard": narrower info card, two-column stats, anchored at the bottom ---------- */
#stage.ux-card #card{left:630px;width:660px;top:auto;bottom:112px;min-height:0}
#stage.ux-card #card .ch{height:40px;font-size:18px}
#stage.ux-card #card .ch{white-space:nowrap;overflow:hidden}
#stage.ux-card #card .ch .tg,#stage.ux-card #card .ch .arrow{flex:none}
#stage.ux-card #card .ch .old{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#stage.ux-card #card .emptyc{padding:12px 16px;font-size:17px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;padding:6px 16px 8px}
.cst{display:flex;align-items:center;gap:8px;height:30px;border-bottom:1px solid #1a1d21;font-size:16px}
.cst .cl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:#c3cad1;white-space:nowrap}
.cst .cl svg{width:15px;height:15px;color:#aab2ba;flex:none}
.cst .cv{white-space:nowrap;font-weight:700;color:#fff}
.cst .cv i{font-style:normal;font-weight:600;color:#8a939b}
.cst .cv em{font-style:normal;color:#6b747c;margin:0 5px}
.cst .cd{flex:none;width:50px;text-align:right;font-weight:700;font-size:15px}
.cst .outs{margin:0;display:inline-flex}
.in-foot .in-q{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid #5a6068;color:var(--accent-2);margin:0 2px}

/* ---------- experiment "typeShape": module type = shape of the row's left end, icons neutral ----------
   The icon block (.ic) is cut to a shape; the row background starts after the icon so the cut shows the panel
   behind it, whatever state rule later rewrites the background shorthand (hence the !important longhands). */
#stage.ux-tshape .slot.pri .ic,#stage.ux-tshape .slot.sec .ic,#stage.ux-tshape .slot.eng .ic,
#stage.ux-tshape .cg-row.pri .ic,#stage.ux-tshape .cg-row.sec .ic,#stage.ux-tshape .cg-row.eng .ic{background:var(--ic-bg)}
#stage.ux-tshape .slot.pri .ic,#stage.ux-tshape .cg-row.pri .ic,.tsh.pri{clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
#stage.ux-tshape .slot.sec .ic,#stage.ux-tshape .cg-row.sec .ic,.tsh.sec{border-radius:999px 0 0 999px}
#stage.ux-tshape .slot.eng .ic,#stage.ux-tshape .cg-row.eng .ic,.tsh.eng{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%)}
#stage.ux-tshape .slot.pri,#stage.ux-tshape .slot.sec,#stage.ux-tshape .slot.eng{background-size:calc(100% - 36px) 100% !important;background-position:right !important;background-repeat:no-repeat !important;border-left-color:transparent !important}
#stage.ux-tshape .cg-row.pri,#stage.ux-tshape .cg-row.sec,#stage.ux-tshape .cg-row.eng{background-size:calc(100% - 46px) 100% !important;background-position:right !important;background-repeat:no-repeat !important;border-left-color:transparent !important}
#stage.ux-tshape .slot.sel.pri,#stage.ux-tshape .slot.sel.sec,#stage.ux-tshape .slot.sel.eng,
#stage.ux-tshape .cg-row.sel.pri,#stage.ux-tshape .cg-row.sel.sec,#stage.ux-tshape .cg-row.sel.eng{box-shadow:none}
#stage.ux-tshape .cat.act.pri,#stage.ux-tshape .cat.act.sec,#stage.ux-tshape .cat.act.eng{border-color:var(--accent)}
.tsh{display:inline-block;width:22px;height:16px;background:var(--ic-bg);margin:0 5px 0 8px;vertical-align:-2px}

/* ---------- heat: fire / cooldown cycle ---------- */
.hcycle{display:flex;height:14px;background:#23272c;overflow:hidden}
.hcycle i{display:block;height:100%}
.hcycle i.fire{background:linear-gradient(90deg,#c2552b,#ff8a3c)}
.hcycle i.cool{flex:1;background:repeating-linear-gradient(90deg,#2a5f8f 0 6px,#23507a 6px 12px)}
.heat-row .hstat{color:#9aa3ab}

/* ---------- leaf rule: arms holding parts are locked ---------- */
.slot .lockq{width:34px;height:100%;display:grid;place-items:center;color:#8a939b;border-left:1px solid #1c1e21;cursor:help}
.slot .lockq svg{width:15px;height:15px}
.cg-empty.locked{color:#c3cad1}
.cg-empty.locked svg{width:26px;height:26px;color:#8a939b}

#card .cf .lockline svg{width:15px;height:15px;color:#8a939b}

/* ---------- experiment "listModes": views of the socket list ---------- */
.lmodes{display:flex;align-items:center;gap:4px;margin:10px 20px 0}
.lmodes .lm{flex:1;height:30px;background:#1e2126;color:#9aa3ab;font-size:14px;font-weight:700;letter-spacing:.06em;border-bottom:3px solid transparent;cursor:pointer}
.lmodes .lm:hover{color:#fff;background:#262a30}
.lmodes .lm.act{color:#fff;background:#2b2f35;border-bottom-color:var(--accent)}
.lmodes .gp,.lmodes .key{flex:none;transform:scale(.85)}
.sec-title .st-l svg{width:16px;height:16px;color:#aab2ba}
.sec-title .st-l .rtag{margin-right:0}

/* ---------- heat: fire time + cooldown as two numbers ---------- */
.heat-row{justify-content:space-between}
.hnum{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto;line-height:1.1}
.hnum span{font-size:15px;color:var(--dim);letter-spacing:.06em}
.hnum b{font-size:26px;color:#8fc3ff;margin-top:2px}

/* ---------- experiment "bodyButton" (now a switcher row) ---------- */
.bodysw{display:flex;align-items:center;gap:8px;margin:12px 20px 2px;height:46px;border:1px solid #5a6068;background:#15181c}
.bodysw.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:#2a1a15}
.bsw{flex:none;width:44px;height:100%;display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--accent-2);background:#1d2126;cursor:pointer}
.bsw:hover{background:#2b3036;color:#fff}
.bsw-mid{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.05;min-width:0}
.bsw-mid .bname{width:auto;font-size:22px;font-weight:700;letter-spacing:.06em;color:#fff;cursor:default}
.bsw-mid .bname:hover{text-decoration:none}
.bsw-mid small{font-size:13px;letter-spacing:.1em;color:#9aa3ab}
.guidehint{white-space:nowrap}

/* ---------- experiment "stackBadge": quantity on the icon corner ---------- */
.cg-row .ic{position:relative}
.cg-row .ic .qty{position:absolute;right:4px;bottom:3px;font-size:14px;font-weight:700;line-height:1;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}

/* ---------- experiment "rarityFade": rarity colour under the name, fading out before the stats ---------- */
#stage.ux-rfade .slot.rar,#stage.ux-rfade .cg-row.rar{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 58%,#2c2f34) 0%,color-mix(in srgb,var(--rc) 26%,#2c2f34) 36%,#2c2f34 66%)}
#stage.ux-rfade .slot.rar:hover,#stage.ux-rfade .slot.rar.hov,#stage.ux-rfade .cg-row.rar:hover,#stage.ux-rfade .cg-row.rar.hov{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 66%,#3a3e44) 0%,color-mix(in srgb,var(--rc) 32%,#3a3e44) 36%,#34373c 66%)}
#stage.ux-rfade .slot.rar.sel.focus,#stage.ux-rfade .cg-row.rar.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 50%,#55402f) 0%,#55402f 40%,#3d2f25 100%)}

/* ---------- experiment "shipQuality": loadout quality row ---------- */
.qrow{padding:2px 0 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.qhead{display:flex;align-items:center;gap:10px}
.qhead .rl{flex:1;font-size:15px;color:var(--dim);letter-spacing:.08em}
.qhead .qv{display:flex;align-items:baseline;gap:6px}
.qhead .qv small{font-size:14px;color:var(--dim);letter-spacing:.08em}
.qhead .qv b{font-size:24px;color:#fff}
.qbar{display:flex;gap:3px;height:12px;margin-top:6px}
.qbar i{flex:1;background:var(--rc);box-shadow:0 0 5px color-mix(in srgb,var(--rc) 45%,transparent)}
.qbar i.none{background:#23272c;box-shadow:none}

/* ---------- experiment "slideCargo": cargo slides in over the socket list, overview becomes a tall column ---------- */
#cargoPanel{display:none}
#stage.ux-slide #cargoPanel{display:block;position:absolute;left:40px;top:180px;width:644px;height:780px;z-index:12;transform:translateX(-520px);opacity:0;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none;box-shadow:12px 0 30px rgba(0,0,0,.55)}
#stage.ux-slide #cargoPanel.open{transform:none;opacity:1;pointer-events:auto}
#stage.ux-slide #cargoPanel .cg{margin-top:0;height:100%}
.cg-back{display:flex;align-items:center;gap:8px;margin:8px 14px 0;padding:6px 10px;align-self:flex-start;background:#1e2126;border:1px solid #3a3f46;color:#c3cad1;font-size:14px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.cg-back:hover{border-color:#e9edf0;color:#fff}
.cg-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 14px 6px}
.cg-bar .cg-back{margin:0}
#stage.ux-slide #right{left:1540px;width:340px}
#stage.ux-slide .ov{flex:none}   /* height follows the content: no empty space at the bottom */
#stage.ux-slide #right{height:auto}
#stage.ux-slide .ov .head{font-size:21px;letter-spacing:.02em;white-space:nowrap}
#stage.ux-slide .ov .head small{font-size:14px}
#stage.ux-slide .valrow.sum{flex-direction:column;align-items:stretch;gap:10px}
#stage.ux-slide .pw-row:not(.heat-row){flex-wrap:wrap;row-gap:6px}
#stage.ux-slide .pw-row:not(.heat-row) .pbar{order:3;flex:1 1 100%}
#stage.ux-slide .stats{grid-template-columns:1fr}
#stage.ux-slide .st:nth-child(2n){border-left:0;padding-left:8px}
#stage.ux-slide .st{padding-top:7px;padding-bottom:7px}
#stage.ux-slide #shipbox{width:1050px}
#stage.ux-slide.ux-card #card{left:685px}

/* ---------- 3D view taller (the compact card sits over its lower edge) ---------- */
#stage.ux-card #shipbox{height:640px}

/* ---------- list sort chip (same as the cargo one) ---------- */
.lsort{display:flex;align-items:center;justify-content:space-between;margin:10px 20px 0;font-size:15px;color:var(--dim);letter-spacing:.08em}

/* ---------- experiment "maxRatings": DPS / value vs the best build of this Body ---------- */
.dpsblock{display:flex;flex-direction:column;gap:8px;padding:2px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.dpsrow .dh{display:flex;align-items:center;gap:8px}
.dpsrow .rl{flex:1;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--dim);letter-spacing:.06em}
.dpsrow .rl svg{width:18px;height:18px;color:#d6dbe0}
.dpsrow .dh b{font-size:30px;line-height:1;color:#fff}
.dpsrow .dslot{width:58px}
.rated{height:6px;background:#23272c;margin-top:5px;overflow:hidden}
.rated i{display:block;height:100%;background:var(--rc);box-shadow:0 0 6px var(--rc)}
.ratedp{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;margin-top:3px;text-align:right}
.valrow.sum .vcol .rated{width:100%}

/* ---------- compact info card, tighter ---------- */
#stage.ux-card #card{width:620px;left:640px}
#stage.ux-slide.ux-card #card{left:705px}
#stage.ux-card #card .ch{height:34px;font-size:16px;padding:0 12px}
#stage.ux-card #card .ch .tg{font-size:13px;padding:1px 6px}
#stage.ux-card .cgrid{padding:3px 12px 4px;column-gap:20px}
#stage.ux-card .cst{height:25px;font-size:15px}
#stage.ux-card .cst .cl svg{width:14px;height:14px}
#stage.ux-card #card .cf{padding:6px 12px;font-size:15px}
#stage.ux-card #card .emptyc{padding:8px 12px;font-size:16px;line-height:1.4}
#stage.ux-card #card .retline{padding:4px 12px;font-size:14px}

/* ---------- value + loadout quality grouped; quality tiles ---------- */
.valrow.sum.grp{flex-direction:column;align-items:stretch;gap:10px}
.valrow.sum.grp .qrow{padding:0;margin:0;border:0}
.qtiles{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.qtiles .qt{width:22px;height:22px;display:grid;place-items:center;background:var(--rc);box-shadow:0 0 5px color-mix(in srgb,var(--rc) 45%,transparent)}
.qtiles .qt svg{width:13px;height:13px;fill:#0b0d10}

/* ---------- Body panel as wide as the overview (slide-in layout) ---------- */
#stage.ux-slide #left{width:374px}
#stage.ux-slide #shipbox{left:424px;width:1116px}
#stage.ux-slide.ux-card #card{left:694px;width:210px;bottom:120px;background:var(--panel);border-color:var(--line)}
/* half-width card: the title may wrap, rows are tighter, the description flows under the parameters */
#stage.ux-slide.ux-card #card .ch{height:auto;min-height:34px;flex-wrap:wrap;gap:2px 6px;padding:6px 10px;white-space:normal;overflow:visible}
#stage.ux-slide.ux-card #card .ch .old{flex:0 1 auto;overflow:visible;text-overflow:clip;white-space:normal}
#stage.ux-slide.ux-card #card .ch .fam{margin-left:0;flex-basis:100%}
#stage.ux-slide.ux-card .cgrid{padding:3px 10px 4px}
#stage.ux-slide.ux-card .cst{gap:4px;font-size:14px}
#stage.ux-slide.ux-card .cst .cl{gap:4px}
#stage.ux-slide.ux-card .cst .cd{width:36px;font-size:13px}
#stage.ux-slide.ux-card .cst .cv em{margin:0 2px}
#stage.ux-slide.ux-card #card .cf{padding:8px 10px;font-size:14px}
#stage.ux-slide.ux-card #card .cf.desc{display:block;line-height:1.35;color:#9aa3ab;letter-spacing:.02em}   /* same background as the other panels */
#stage.ux-slide.ux-card .cgrid{grid-template-columns:1fr}   /* parameters stacked in one column: a tall, narrow card */   /* next to the socket list (bottom-aligned with it), out of the centre of the 3D view */
#stage.ux-slide .lp-body{padding:6px 14px 14px}
#stage.ux-slide .lsort{margin-left:14px;margin-right:14px}
#stage.ux-slide .lp-head.bodysel .nm{font-size:22px}
#stage.ux-slide .slot{margin-left:calc(var(--d,0)*18px)}
.valrow.sum.grp .qhead .rl{white-space:nowrap;font-size:14px}
.valrow.sum.grp .qhead .dslot{width:50px}

/* Body name marquee: only when the name is wider than its box */
.bsw-mid .bname{display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-align:center}
.bsw-mid .bname .bn-t{display:inline-block}
.bsw-mid .bname.scroll{text-align:left}
.bsw-mid .bname.scroll .bn-t{animation:bn-scroll 6s ease-in-out infinite alternate}
@keyframes bn-scroll{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(calc(-1 * var(--over)))}}
.lsort{justify-content:flex-end}

/* ---------- names never cut: long module names scroll ---------- */
#left .slot .nm{display:flex;align-items:center;min-width:0}
#left .slot .nmx{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
#left .slot .nmx .nmt{display:inline-block}
#left .slot .nmx.scroll .nmt,.bsw-mid .bname.scroll .bn-t{animation:bn-scroll 6s ease-in-out infinite alternate}

/* ---------- power bar: white, half height ---------- */
.pbar{height:13px}
.pbar i.on{background:#e9edf0}

/* ---------- ratings: value / DPS / speed coloured by rarity band, with a fade like the module rows ---------- */
.rated-bg{background:linear-gradient(0deg,color-mix(in srgb,var(--rc) 42%,transparent) 0%,color-mix(in srgb,var(--rc) 24%,transparent) 50%,color-mix(in srgb,var(--rc) 8%,transparent) 100%)}   /* rises from the bottom all the way to the top of the cell */
.valrow.sum.grp .vcol.rated-bg,.dpsrow.rated-bg{padding:6px 8px;margin:0 -8px}
.dpsblock{gap:4px}

/* ---------- 3D view down to the command bar ---------- */
#stage.ux-card #shipbox{height:812px}

/* ---------- overview tidy-up ---------- */
.pbar{height:6px}
.valrow.sum.grp .qhead .qv small{font-size:14px;color:var(--dim);letter-spacing:.08em}
.valrow.sum.grp .qhead .qv small b{font-size:14px;color:#e9edf0}
/* stat icons as small as the DPS row icons */
.st .si{width:22px;height:22px}
.st .si svg{width:18px;height:18px}
.st{gap:10px}

/* every overview line (DPS, speed, boost, integrity, shield) has the same box: full width, same padding and height */
.dpsrow{padding:6px 8px;margin:0 -8px}
.dpsrow .dh b small{font-size:16px;font-weight:600;margin-left:3px;color:var(--dim)}
.rated-bg .dh b small{color:inherit;opacity:.8}
.dpsblock.lines{border-bottom:0;margin-bottom:0;padding-bottom:2px}

/* ---------- integrated modules (top of the socket list) ---------- */
.slot.integ{cursor:default}
.slot.integ .lockq{cursor:default}
.sec-title .st-l svg{width:14px;height:14px}
.dpsblock.lines:not(.defense){border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}

/* ---------- overview: every section has the same space above and below its divider ---------- */
#stage.ux-slide .ov-body>.valrow,#stage.ux-slide .ov-body>.pw-row,#stage.ux-slide .ov-body>.dpsblock{padding:10px 0;margin:0;border-bottom:1px solid var(--line)}
#stage.ux-slide .ov-body>.valrow{padding-top:4px}
#stage.ux-slide .ov-body>.dpsblock:last-child{border-bottom:0;padding-bottom:4px}

/* ---------- left column: Body switcher · compact overview · socket list ---------- */
#lcol{position:absolute;left:40px;top:180px;width:547px;height:780px;display:flex;flex-direction:column;gap:10px;z-index:3}
#lcol>#shipPanel{flex:none}
#stage.ux-slide #lcol>#right{position:static;flex:none;width:auto;height:auto}
#lcol>#lrow{flex:1 1 auto;min-height:0;display:flex;gap:10px;align-items:stretch}
#stage.ux-slide #lrow>#left{position:relative;left:auto;top:auto;width:auto;flex:1 1 0;min-width:0;min-height:0;max-height:none}
#stage.ux-slide.ux-card #card{left:1670px;top:180px;bottom:auto;width:210px;max-height:780px;overflow:auto;background:var(--panel);border-color:var(--line)}
#stage.ux-slide #shipbox{left:597px;width:1283px}   /* from the left column to the right edge */
.head.bodyhead{padding:0 6px 0 4px;gap:6px}
/* compact overview: two stats per line */
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;align-items:start;margin:0 -8px}
.ovgrid>.dpsrow{grid-column:1/-1}
.ovc{padding:6px 8px;min-width:0}
.ovc .rl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.ovc .rl svg{width:16px;height:16px;color:#d6dbe0;flex:none}
.ovc .cv{display:flex;align-items:center;margin-top:2px}
.ovc .dslot{flex:1 1 auto;width:auto;min-width:0;justify-content:flex-start}
.ovc .dslot .sd{padding:1px 4px}
.ovc .cv b{flex:none;font-size:28px;line-height:1.1;color:#fff;white-space:nowrap;text-align:right}
.ovc .cv b small{font-size:15px;font-weight:600;margin-left:3px;color:var(--dim)}
.ovc .cv b .bad{color:var(--bad)}
.ovgrid.c5{grid-template-columns:repeat(5,1fr);gap:6px 2px}
.ovgrid.c4{grid-template-columns:repeat(4,1fr);gap:6px 2px}
/* link lines from the 3D sockets to the socket list */
#links{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:2;overflow:visible}
#links path{fill:none;stroke:rgba(190,200,210,.3);stroke-width:1.5;stroke-linejoin:round}
#links circle{fill:rgba(190,200,210,.55)}
#links path.hov{stroke:#fff;stroke-width:2}#links circle.hov{fill:#fff}
#links path.sel{stroke:var(--accent);stroke-width:2.5}#links circle.sel{fill:var(--accent)}
#links .off{display:none}
/* an unknown ship (only its slot in the list is known): empty 3D scene, no labels, no details card */
#stage.body-unknown #labels3d,#stage.body-unknown .tag3d{display:none!important}
#stage.body-unknown #card{display:none}
#stage.body-unknown #right .ovc b{color:#6b747c}
.ovgrid.c5 .ovc,.ovgrid.c4 .ovc{padding:6px 4px}
.ovgrid.c5 .ovc .rl{font-size:13px;letter-spacing:0}
.ovgrid.c5 .ovc .cv b{font-size:23px}
.ovgrid.c5 .ovc .cv b small{font-size:13px;margin-left:2px}
.ovgrid.c5 .ovc .dslot .sd{font-size:14px;padding:1px 3px}
.ovgrid.c5 .ovc .cv b,.ovgrid.c4 .ovc .cv b{font-size:26px}
.ovc .rl{letter-spacing:.02em}
/* label above; below it the change on the left (in the free space) and the value flush right */
.ovc .cv{flex-direction:row;align-items:center;margin-top:2px}
.ovc .dslot{flex:1 1 auto;width:auto;min-width:0;justify-content:flex-start;align-items:center}
.dpsblock>.ovgrid+.qrow{margin-top:10px}
.bodyhead .gp,.bodyhead .key{flex:none;transform:scale(.9)}
.bodyhead .bsw{width:36px;height:34px;background:rgba(0,0,0,.28);color:#fff;font-size:26px}
.bodyhead .bsw:hover{background:#fff;color:var(--accent)}
.bodyhead .bsw-mid{line-height:1;flex-direction:row;justify-content:center;align-items:baseline;gap:14px}
.bodyhead .bsw-mid .bname{flex:0 1 auto;color:#fff;font-size:22px;letter-spacing:.05em}
.bodyhead .bsw-mid small{flex:none;font-size:16px;font-weight:600;color:#ffe3d8}
/* socket list: one view button in the header, foldable integrated block */
.lmcycle{align-self:center;display:flex;align-items:center;gap:8px;margin-right:8px;height:32px;padding:0 10px;background:rgba(0,0,0,.28);color:#fff;font-size:16px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.lmcycle:hover{background:#fff;color:var(--accent)}
.lmcycle small{font-size:12px;font-weight:600;letter-spacing:.1em;color:#ffe3d8}
.lmcycle:hover small{color:var(--accent)}
.lmcycle .gp,.lmcycle .key{flex:none;transform:scale(.8);margin:-4px -4px -4px 0}
.sec-title.integ-t{cursor:pointer;user-select:none}
.sec-title.integ-t:hover{color:#fff}
.sec-title .chev{font-size:14px;width:12px;color:#aab2ba}
.head.focus{box-shadow:inset 0 0 0 3px #fff}
#stage.ux-slide .ov-body{padding:2px 16px 2px}
#stage.ux-slide .ov-body>.dpsblock{padding:6px 0;margin:0;border-bottom:1px solid var(--line)}
#stage.ux-slide .ov-body>.dpsblock:last-child{border-bottom:0}
.dpsrow .dh{gap:6px}
.dpsrow .rl{white-space:nowrap;letter-spacing:.04em}
.dpsrow .dslot{flex:none;width:54px;justify-content:flex-end}
.dpsrow .dslot .sd{padding:1px 4px}
.dpsrow .dh b{flex:none;min-width:84px;text-align:right;font-size:28px;white-space:nowrap}
.dpsrow .dh b small{font-size:15px}
.dpsrow .dh b .bad{color:var(--bad)}
.dpsblock .qrow{padding:0;margin:8px 0 0;border:0}
.qhead .dslot{flex:none;width:54px}
</style>
</head>
<body>
<div id="stage">
  <div class="scene"></div>

  <div id="top"></div>
  <div id="build"></div>
  <!-- DEBUG: mockup only, not part of the game -->
  <button class="dbgbtn" id="dbgRandom" title="Debug only, not part of the game: mount a random legal build">DEBUG · RANDOM BUILD</button>

  <div id="lcol">

      <div id="left" class="panel"></div>

  <div id="intro"></div>

  <div id="bottom"></div>
  <div id="leave-ov"><div>UNDOCKING…<small>MOCKUP — CLICK TO CLOSE</small></div></div>
</div>

<script src="../../vendor/three.min.js"></script>
<script src="../../vendor/GLTFLoader.js"></script>
